org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -XX:+UseParallelGC -Dnetworkaddress.cache.ttl=1 -Dnetworkaddress.cache.negative.ttl=0
org.gradle.parallel=true
org.gradle.caching=false
org.gradle.configuration-cache=false
# The host's DNS for Maven Central is intermittent; give HTTP generous timeouts
# and let the retry wrapper (build.ps1) re-run until everything is cached.
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=120000
systemProp.org.gradle.internal.repository.max.retries=10
systemProp.org.gradle.internal.repository.initial.backoff=500
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
