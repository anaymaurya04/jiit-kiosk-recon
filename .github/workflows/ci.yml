name: ci

# Runs on every pull request and on every push to main. This is the check
# that must go green before release.yml will publish anything.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# a new push supersedes the old run on the same ref
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Test and build
        working-directory: KioskApp
        run: gradle testDebugUnitTest assembleDebug --console=plain
