name: release

# Pushing a tag like v0.3.0 builds that commit and publishes the APK on the
# release page. The tag must match versionName in app/build.gradle.kts —
# bump both together, push main, then push the tag.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      # the release APK must keep installing over dev builds and earlier
      # releases, which only works if it is signed with the same key every time
      - name: Restore the signing keystore
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::DEBUG_KEYSTORE_B64 secret is missing — add it in Settings → Secrets and variables → Actions"
            exit 1
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$HOME/.android/debug.keystore"

      - name: The tag must match versionName
        working-directory: KioskApp
        run: |
          version=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          if [ "$version" != "${GITHUB_REF_NAME#v}" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match versionName $version — bump app/build.gradle.kts, push main, move the tag"
            exit 1
          fi

      - name: Build and test
        working-directory: KioskApp
        run: gradle assembleRelease testDebugUnitTest --console=plain

      - name: Name the APK after the tag
        working-directory: KioskApp
        run: cp app/build/outputs/apk/release/app-release.apk "jiit-kiosk-${GITHUB_REF_NAME}.apk"

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: KioskApp/jiit-kiosk-*.apk
          generate_release_notes: true
