name: release

# Two ways in:
#  - a version tag like v0.3.0 releases that exact commit (the manual flow);
#  - a green ci run on main releases the merge only when versionName has no
#    tag yet. A merge that bumps the version ships itself; a normal merge is a
#    no-op. CI is the gate, so a red build never publishes.
on:
  push:
    tags: ["v*"]
  workflow_run:
    workflows: ["ci"]
    types: [completed]
    branches: [main]

permissions:
  contents: write

# one release at a time; a second main push waits instead of racing the tag
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event_name == 'push' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
    steps:
      - uses: actions/checkout@v4
        with:
          # the exact commit ci verified, not main's tip by the time this runs
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # decides whether this merge is a release at all
      - name: Is this version new?
        id: gate
        run: |
          version=$(grep -oP 'versionName = "\K[^"]+' KioskApp/app/build.gradle.kts)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "v$version is already published; this merge ships nothing"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v4
        if: steps.gate.outputs.publish == 'true'
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v4
        if: steps.gate.outputs.publish == 'true'

      - uses: gradle/actions/setup-gradle@v4
        if: steps.gate.outputs.publish == 'true'
        with:
          gradle-version: "9.6.0"

      # the release APK must keep installing over dev builds and earlier
      # releases, which only works if it is signed with the same key every time
      - name: Restore the signing keystore
        if: steps.gate.outputs.publish == 'true'
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::DEBUG_KEYSTORE_B64 secret is missing — add it in Settings → Secrets and variables → Actions"
            exit 1
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$HOME/.android/debug.keystore"

      - name: The tag must match versionName
        if: github.event_name == 'push' && steps.gate.outputs.publish == 'true'
        working-directory: KioskApp
        run: |
          version=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          if [ "$version" != "${GITHUB_REF_NAME#v}" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match versionName $version — bump app/build.gradle.kts, push main, move the tag"
            exit 1
          fi

      - name: Build and test
        if: steps.gate.outputs.publish == 'true'
        working-directory: KioskApp
        run: gradle assembleRelease testDebugUnitTest --console=plain

      - name: Name the APK after the version
        if: steps.gate.outputs.publish == 'true'
        working-directory: KioskApp
        run: cp app/build/outputs/apk/release/app-release.apk "jiit-kiosk-v${{ steps.gate.outputs.version }}.apk"

      - name: Publish the release
        if: steps.gate.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          # creates the v* tag itself; a manual tag push reuses it
          tag_name: v${{ steps.gate.outputs.version }}
          target_commitish: ${{ github.event.workflow_run.head_sha || github.sha }}
          files: KioskApp/jiit-kiosk-*.apk
          generate_release_notes: true
